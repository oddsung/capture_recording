<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'"
    />
    <title>Recording Area</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
        user-select: none;
        cursor: crosshair;
      }
      #picker-root {
        position: fixed;
        inset: 0;
      }
      #picker-root canvas {
        position: fixed;
        inset: 0;
        display: block;
      }
      .label {
        position: fixed;
        padding: 4px 9px;
        border-radius: 6px;
        background: rgba(20, 20, 22, 0.9);
        color: #fff;
        font: 600 12px/1.3 'Segoe UI', system-ui, sans-serif;
        white-space: nowrap;
        max-width: 60vw;
        overflow: hidden;
        text-overflow: ellipsis;
        pointer-events: none;
      }
      .hint {
        position: fixed;
        top: 18px;
        left: 50%;
        transform: translateX(-50%);
        padding: 10px 16px;
        border-radius: 999px;
        background: rgba(20, 20, 22, 0.9);
        color: #fff;
        font: 600 13px/1.2 'Segoe UI', system-ui, sans-serif;
        box-shadow: 0 6px 24px rgba(0, 0, 0, 0.35);
        white-space: nowrap;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="picker-root"></div>
    <script type="module" src="/src/picker.tsx"></script>
  </body>
</html>
