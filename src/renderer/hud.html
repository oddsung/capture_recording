<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'"
    />
    <title>Recording HUD</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
        user-select: none;
      }
      #hud-root {
        width: 100%;
        height: 100%;
      }

      .hud {
        width: 100%;
        height: 100%;
        box-sizing: border-box;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 0 14px 0 16px;
        border-radius: 26px;
        background: rgba(24, 24, 27, 0.92);
        color: #fff;
        font: 600 13px/1.2 'Segoe UI', system-ui, sans-serif;
        box-shadow: 0 4px 18px rgba(0, 0, 0, 0.35);
        -webkit-app-region: drag; /* the pill is draggable; buttons opt out */
      }
      .hud .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #ff3b30;
        flex: none;
      }
      .hud .dot.rec {
        animation: hud-pulse 1.2s ease-in-out infinite;
      }
      .hud .dot.paused {
        background: #ffcc00;
        animation: none;
      }
      @keyframes hud-pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.25;
        }
      }
      .hud .label {
        opacity: 0.92;
        white-space: nowrap;
      }
      .hud .time {
        font-variant-numeric: tabular-nums;
        font-size: 14px;
      }
      .hud .spacer {
        flex: 1;
      }
      .hud button {
        -webkit-app-region: no-drag;
        border: 0;
        border-radius: 999px;
        padding: 6px 12px;
        font: 600 12px 'Segoe UI', system-ui, sans-serif;
        cursor: pointer;
        color: #fff;
        background: rgba(255, 255, 255, 0.14);
        white-space: nowrap;
      }
      .hud button:hover {
        background: rgba(255, 255, 255, 0.24);
      }
      .hud button.stop {
        background: #ff3b30;
      }
      .hud button.stop:hover {
        background: #ff564c;
      }
      .hud .hint {
        opacity: 0.55;
        font-weight: 500;
        font-size: 11px;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div id="hud-root"></div>
    <script type="module" src="/src/hud.tsx"></script>
  </body>
</html>
